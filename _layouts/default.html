<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- jekyll-seo-tag emits title, description, canonical and Open Graph. The
       Person JSON-LD below is the entity claim: one name, one place, one
       occupation, and every profile that is the same person, so a search
       engine can tie the scattered articles to a single Fernando Arredondo
       de la Mora rather than to whoever else shares the name. -->
  {% seo %}
  {% feed_meta %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Fernando Arredondo de la Mora",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "jobTitle": "Agricultor",
    "description": "{{ site.description | strip_newlines | escape }}",
    "homeLocation": { "@type": "Place", "name": "Tamaulipas, México" },
    "knowsAbout": ["agricultura", "tradiciones familiares", "cultura de Tamaulipas", "música regional", "vida rural"],
    "sameAs": {{ site.social.links | jsonify }}
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Inlined on purpose: a linked stylesheet on GitHub Pages can be shadowed
       by a stale cached build (it happened on the sister site). -->
  <style>
/* Fernando Arredondo de la Mora
 *
 * A personal site about farming life in Tamaulipas. Warm, earthy, unhurried:
 * the articles are long reads about land, family and tradition, so the page
 * should feel like a printed almanac rather than a tech blog. Light and dark
 * are both defined so long reads work on any device.
 */

:root {
  --bg: #fffdf9;
  --surface: #f7f2ea;
  --border: #e8dfd2;
  --text: #111111;
  --muted: #5c5c5c;
  --accent: #8a5a2b;
  --accent-soft: #f6efe6;
  --radius: 10px;
  --measure: 68ch;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121010;
    --surface: #1c1816;
    --border: #2e2723;
    --text: #f2f2f3;
    --muted: #a1a1a8;
    --accent: #d9a86c;
    --accent-soft: #2a2117;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-size: 1.0625rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

/* ── header ─────────────────────────────────────────────────────── */

.site-header {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}

.site-header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 68px;
}

.brand {
  font-weight: 650;
  font-size: 1.0625rem;
  letter-spacing: -0.015em;
  color: var(--text);
  text-decoration: none;
}

.nav { display: flex; gap: 22px; }

.nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9375rem;
}

.nav a:hover { color: var(--text); }

/* ── hero, home page only ───────────────────────────────────────── */

.hero { padding: 64px 0 40px; border-bottom: 1px solid var(--border); }

.hero h1 {
  margin: 0 0 14px;
  font-size: clamp(2rem, 5vw, 2.75rem);
  line-height: 1.12;
  letter-spacing: -0.03em;
  font-weight: 660;
}

.hero p {
  margin: 0;
  max-width: 60ch;
  color: var(--muted);
  font-size: 1.125rem;
}

.hero .cta {
  display: inline-block;
  margin-top: 26px;
  padding: 10px 18px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius);
  text-decoration: none;
  font-size: 0.9375rem;
  font-weight: 550;
}

/* ── post list ──────────────────────────────────────────────────── */

.list { padding: 8px 0 72px; }

.list h2 {
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  font-weight: 600;
  margin: 40px 0 4px;
}

.card {
  display: block;
  padding: 24px 0;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  color: inherit;
}

.card:hover .card-title { color: var(--accent); }

.card-title {
  margin: 0 0 6px;
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.017em;
  line-height: 1.35;
}

.card-excerpt {
  margin: 0;
  color: var(--muted);
  font-size: 0.9688rem;
  /* Two lines: enough to judge relevance, not enough to replace the article. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  margin-top: 10px;
  font-size: 0.8125rem;
  color: var(--muted);
}

/* ── article ────────────────────────────────────────────────────── */

.post { padding: 56px 0 80px; }

.post-header { margin-bottom: 36px; }

.post-header h1 {
  margin: 0 0 12px;
  font-size: clamp(1.85rem, 4.4vw, 2.4rem);
  line-height: 1.18;
  letter-spacing: -0.028em;
  font-weight: 660;
}

.post-meta { color: var(--muted); font-size: 0.875rem; }

.post-body { max-width: var(--measure); }

.post-body h2 {
  margin: 44px 0 12px;
  font-size: 1.375rem;
  line-height: 1.3;
  letter-spacing: -0.02em;
  font-weight: 620;
}

.post-body h3 {
  margin: 32px 0 10px;
  font-size: 1.125rem;
  font-weight: 600;
}

.post-body p, .post-body li { color: var(--text); }

.post-body ul, .post-body ol { padding-left: 1.25em; }

.post-body li { margin: 7px 0; }

.post-body a { color: var(--accent); text-underline-offset: 2px; }

.post-body strong { font-weight: 620; }

.post-body blockquote {
  margin: 28px 0;
  padding: 16px 20px;
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.post-body blockquote > :first-child { margin-top: 0; }
.post-body blockquote > :last-child { margin-bottom: 0; }

.post-body code {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 5px;
  font-size: 0.9em;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.post-body img { max-width: 100%; height: auto; border-radius: var(--radius); }

.post-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 24px 0;
  font-size: 0.9375rem;
}

.post-body th, .post-body td {
  border: 1px solid var(--border);
  padding: 9px 12px;
  text-align: left;
}

.post-body th { background: var(--surface); font-weight: 600; }

/* Long tables must scroll inside their own box rather than widening the page. */
.table-scroll { overflow-x: auto; }

/* ── closing call to action ─────────────────────────────────────── */

.post-cta {
  margin-top: 56px;
  padding: 26px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.post-cta p { margin: 0 0 14px; color: var(--muted); }

.post-cta a {
  display: inline-block;
  padding: 9px 16px;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.9375rem;
  font-weight: 550;
}

/* ── footer ─────────────────────────────────────────────────────── */

.site-footer {
  border-top: 1px solid var(--border);
  padding: 36px 0 56px;
  color: var(--muted);
  font-size: 0.875rem;
}

.site-footer .cols {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
  justify-content: space-between;
}

.site-footer a { color: var(--muted); text-decoration: none; }
.site-footer a:hover { color: var(--text); text-decoration: underline; }

.footer-links { display: flex; flex-wrap: wrap; gap: 16px; }

@media (max-width: 600px) {
  .hero { padding: 44px 0 32px; }
  .post { padding: 36px 0 56px; }
  .nav { gap: 16px; }
}

/* ── related guides ─────────────────────────────────────────────── */

/* Every article linking to four others is what stops each post being an
   orphan: it gives a crawler a route through the whole set and spreads
   internal link equity instead of stranding it on one page. */
.related {
  margin-top: 48px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
  max-width: var(--measure);
}

.related h2 {
  margin: 0 0 14px;
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  font-weight: 600;
}

.related ul { margin: 0; padding: 0; list-style: none; }

.related li { margin: 0; border-bottom: 1px solid var(--border); }

.related li:last-child { border-bottom: 0; }

.related a {
  display: block;
  padding: 12px 0;
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  line-height: 1.4;
}

.related a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Fernando Arredondo de la Mora</a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">Artículos</a>
        <a href="https://fernando-arredondo-de-la-mora.blogspot.com/">Blog</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="wrap cols">
      <div>
        <strong style="color:var(--text)">Fernando Arredondo de la Mora</strong><br>
        Agricultor de Tamaulipas. Campo, familia y tradiciones.
      </div>
      <div class="footer-links">
        <a href="https://fernando-arredondo-de-la-mora.blogspot.com/">Blog</a>
        <a href="https://mastodon.social/@fernandoarredondodelamora1">Mastodon</a>
        <a href="https://bsky.app/profile/fernandoarredo.bsky.social">Bluesky</a>
        <a href="https://dev.to/fernandoarredondodelamora1">Dev.to</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
    </div>
  </footer>
</body>
</html>
